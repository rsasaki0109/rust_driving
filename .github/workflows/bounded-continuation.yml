name: Bounded continuation profile checks
on:
  push:
    branches: [feat/bounded-continuation-profile]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Format and pin source
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add crates/planning/src/approach_continuation.rs crates/planning/src/lib.rs crates/pipeline/src/lib.rs crates/pipeline/tests/planning_diagnostics.rs crates/pipeline/examples/inspect_continuations.rs crates/pipeline/tests/continuation_selection.rs
            git commit -m 'Format experimental bounded continuation profiles'
            git push --force-with-lease="refs/heads/feat/bounded-continuation-profile:$EXPECTED_SOURCE" origin HEAD:refs/heads/feat/bounded-continuation-profile
          fi
          git rev-parse HEAD
      - name: Required workspace checks including continuation tests
        run: bash scripts/check.sh
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12650721879'
          run-id: '40319988642'
          github-token: ${{ github.token }}
          path: retained-small-approaches
          merge-multiple: true
      - name: Replay frozen paired logs with shadow continuation probes
        run: python scripts/inspect_continuations.py --evidence retained-small-approaches --output artifacts/continuation-shadow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-shadow
          path: artifacts/continuation-shadow
