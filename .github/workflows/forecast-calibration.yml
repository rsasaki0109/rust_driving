name: Grouped forecast calibration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecast-calibration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy
      - name: Run independent temporal and dependence controls
        run: python scripts/test_forecast_calibration.py
      - name: Run the pinned workspace and original scenario replays
        run: bash scripts/check.sh
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47a949707d480f3d62cff8d4ad47a52fe1842866
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical source equivalence and analytic controls
        run: |
          test "$(git rev-parse HEAD)" = 47a949707d480f3d62cff8d4ad47a52fe1842866
          git fetch --no-tags --depth=1 origin 8550e1a2b1d06703d05036a625609e21b9fa0cf6
          git diff --exit-code 8550e1a2b1d06703d05036a625609e21b9fa0cf6 HEAD -- crates Cargo.lock rust-toolchain.toml integrations/rne
          python scripts/test_forecast_calibration.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12624662660'
          run-id: '40258418216'
          github-token: ${{ github.token }}
          path: retained-directional-evidence
          merge-multiple: true
      - name: Reinspect all 48 historical cases without altering any source outcome
        env:
          RUSTDRIVING_ACTIVE_SOURCE: ${{ github.sha }}
        run: |
          python scripts/check_forecast_calibration.py --evidence retained-directional-evidence --output artifacts/forecast-calibration/report.json
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          receipt=dict(historical=True,analysis_source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              recorded_driver_source='8550e1a2b1d06703d05036a625609e21b9fa0cf6',
              active_source=os.environ['RUSTDRIVING_ACTIVE_SOURCE'],confidence_for_active_driver_established=False)
          Path('artifacts/forecast-calibration/source-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-forecast-calibration-analysis
          path: artifacts/forecast-calibration
          if-no-files-found: warn
